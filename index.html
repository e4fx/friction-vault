<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Friction Locker</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { 
      background: #444; 
      cursor: not-allowed !important; 
      opacity: 0.6;
    }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    
    .modal {
      display: none;
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .instruction-card {
      background: #2a2a2a;
      padding: 30px;
      text-align: center;
      border-radius: 8px;
      margin: 15px 0;
      border: 2px solid #444;
    }
    .action-text {
      font-size: 2em;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .type-action-0 { color: #60a5fa; }
	.type-action-1 { color: #f87171; }
	.type-action-2 { color: #facc15; }

	.type-color-0 { border-color: #2563eb; }
	.type-color-1 { border-color: #ef4444; }
	.type-color-2 { border-color: #eab308; }
    .delete-color-0 { border-color: #ef4444; color: #f87171; }
    .delete-color-1 { border-color: #f97316; color: #fb923c; }
    .delete-color-2 { border-color: #eab308; color: #facc15; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .status { color: #888; font-size: 0.9em; }
  </style>
</head>
<body>

  <h2>Local Friction Locker</h2>

  <div class="field">
    <label>Blocker Name</label>
    <input type="text" id="labelInput" placeholder="e.g., iPhone Screen Time">
    <div id="formError" style="color: #f87171; font-size: 0.8em; margin-top: 4px; display: none;"></div>
  </div>

  <div class="field">
    <label>PIN Length</label>
    <input type="number" id="pinLengthInput" value="4" min="4" max="12">
  </div>

  <div class="field">
    <label>Friction Delay (Minutes)</label>
    <input type="number" id="frictionInput" value="20" min="1">
  </div>

  <button id="startWizardBtn">Create Friction Passcode</button>

  <!-- WIZARD MODAL -->
  <div id="wizardModal" class="modal">
    <div id="phaseBadge" class="badge">PHASE 1</div>
    <div id="stepCounter" class="status">Step 1</div>

    <div id="instructionCard" class="instruction-card">
      <div id="instructionText" class="action-text">TYPE 0</div>
    </div>

    <div class="controls">
      <button id="prevBtn" class="secondary">Previous</button>
      <button id="nextBtn">Next Step</button>
      <button id="autoplayBtn" class="secondary">Autoplay (RECOMMENDED)</button>
      <button id="cancelWizardBtn" class="danger">Cancel</button>
      <span id="autoplayStatus" class="status" style="display:none; color: #60a5fa;"></span>
    </div>

    <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
      <label style="margin:0; font-size: 0.9em;">Autoplay Speed:</label>
      <input type="range" id="speedSlider" min="0.4" max="3.0" step="0.1" value="1.2">
      <span id="speedValue" class="status">1.2s</span>
    </div>
    <div id="speedWarning" style="color: #f87171; font-size: 0.8em; margin-top: 4px; display: none; font-weight: 600;">
      Large risk of unintentional retention of password past 1.4 seconds.
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal">
    <h3 style="margin-top: 0;">Passcode Settings</h3>
    <input type="hidden" id="editItemId">
    <div class="field">
      <label>Blocker Name</label>
      <input type="text" id="editLabelInput">
      <div id="editFormError" style="color: #f87171; font-size: 0.8em; margin-top: 4px; display: none;"></div>
    </div>
    <div class="field">
      <label>Friction Delay (Minutes)</label>
      <input type="number" id="editFrictionInput" min="1">
    </div>
    <div class="controls">
      <button id="saveSettingsBtn">Save Changes</button>
      <button id="cancelSettingsBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div id="deleteModal" class="modal">
    <h3 style="margin-top: 0; color: #f87171;">Confirm Deletion</h3>
    <input type="hidden" id="deleteItemId">
    <p id="deleteWarningText" style="line-height: 1.5; margin-bottom: 15px;"></p>
    <div class="field">
      <input type="text" id="deleteConfirmInput" placeholder="Enter name to confirm">
    </div>
    <div class="controls">
      <button id="confirmDeleteBtn" class="danger" disabled>Delete Passcode</button>
      <button id="cancelDeleteBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <hr style="border-color: #333; margin: 25px 0;">

  <h3>Vault</h3>
  <div id="vaultPathDisplay" class="status" style="margin-bottom: 10px;"></div>
  <div id="vaultList"></div>

  <script src="renderer.js"></script>
</body>
</html>
